<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Plan de montaña (sin conexión)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan montaña">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#f3f4f6;--panel:#fff;--tx:#111827;--mut:#6b7280;--line:#d1d5db;--ac:#2563eb;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--panel:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--line:#334155;--ac:#60a5fa;--warn:#fbbf24;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{padding:8px 12px 4px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;line-height:1.2}
.sub{font-size:12px;color:var(--mut)}
nav{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
nav{overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:1 0 auto;padding:10px 12px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{flex:1;min-height:0;position:relative}
.vista{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.vista.on{display:block}
#vMapa{overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#estado{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:14px;max-height:48%;overflow:auto}
#estado .fila{display:flex;flex-wrap:wrap;gap:4px 14px}
#estado b{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:var(--tx)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#ctl{position:absolute;right:8px;top:8px;z-index:3;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-end;gap:6px;max-height:calc(52% - 12px)}   /* si no entran en vertical (pantalla con zoom), pasan a una segunda columna */
#ctl .btn{width:42px;height:42px;padding:0;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
@media (max-height:760px){#ctl{gap:4px}#ctl .btn{width:36px;height:36px;font-size:17px}}
.pad{padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-size:11px}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
tr.aqui td{background:rgba(37,99,235,.18)}
ul{padding-left:18px;margin:6px 0}
li{margin:4px 0}
h2{font-size:14px;margin:16px 0 4px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.5}
.card .ch{font-size:15px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:16px;padding:6px 12px;font-size:13px}
.chip.on{background:#2563eb;color:#fff;border-color:#2563eb}
.nota{font-size:12px;color:var(--mut)}
#info{margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:13px;display:none}
</style>
</head>
<body>
<header><h1 id="titulo"></h1><div class="sub" id="subtitulo"></div></header>
<nav id="nav"><button data-v="vMapa" class="on">Mapa</button><button data-v="vPerfil">Perfil</button><button data-v="vRuta">Ruta</button><button data-v="vDias">Días</button><button data-v="vPuntos">Puntos</button><button data-v="vSalud">Salud</button><button data-v="vTiempo" id="navTiempo" style="display:none">Tiempo</button><button data-v="vInfo">Info</button></nav>
<main>
 <section class="vista on" id="vMapa">
  <canvas id="mapa"></canvas>
  <div id="ctl"><button class="btn" id="zmas" aria-label="Acercar">+</button><button class="btn" id="zmenos" aria-label="Alejar">−</button><button class="btn" id="centro" aria-label="Centrar en mi posición">◎</button><button class="btn" id="todo" aria-label="Ver todo">⤢</button><button class="btn" id="btnEst" aria-label="Estilo del mapa" style="font-size:18px">◐</button><button class="btn" id="btnCur" aria-label="Alturas de las curvas de nivel" style="font-size:13px;font-weight:700">m</button><button class="btn" id="btnCau" aria-label="Cauces" style="display:none;font-size:16px;font-weight:700">≈</button><button class="btn" id="btnIso" aria-label="Isotermas" style="display:none;font-size:15px;font-weight:700">°C</button></div>
  <div id="estado"></div>
 </section>
 <section class="vista" id="vPerfil"><canvas id="perfil" style="height:46%"></canvas><div class="pad" id="perfilTxt"></div>
  <div class="pad" id="sombraBox" style="display:none"><h2 style="margin-top:0">Sol directo el día de salida (ida de corrido)</h2><canvas id="solgrid" style="height:250px"></canvas><div class="nota" id="sombraTxt"></div></div>
  <div class="pad" id="aclimBox"></div></section>
 <section class="vista" id="vRuta"><div class="pad" style="overflow-x:auto"><table id="tabla"></table><p class="nota" id="rutaNota"></p></div></section>
 <section class="vista" id="vPuntos"><div class="pad" id="puntosTxt"></div></section>
 <section class="vista" id="vSalud"><div class="pad" id="saludTxt"></div></section>
 <section class="vista" id="vDias"><div class="pad" id="diasTxt"></div></section>
 <section class="vista" id="vTiempo"><div class="pad" id="tiempoTxt"></div></section>
 <section class="vista" id="vInfo"><div class="pad" id="infoTxt"></div></section>
</main>
