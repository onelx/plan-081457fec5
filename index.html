<style>
:root{--bg:#f3f4f6;--panel:#fff;--tx:#111827;--mut:#6b7280;--line:#d1d5db;--ac:#2563eb;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--panel:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--line:#334155;--ac:#60a5fa;--warn:#fbbf24;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{padding:8px 12px 4px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;line-height:1.2}
.sub{font-size:12px;color:var(--mut)}
nav{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:10px 4px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{flex:1;min-height:0;position:relative}
.vista{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.vista.on{display:block}
#vMapa{overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#estado{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:14px;max-height:48%;overflow:auto}
#estado .fila{display:flex;flex-wrap:wrap;gap:4px 14px}
#estado b{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:var(--tx)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#ctl .btn{width:42px;height:42px;padding:0;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pad{padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-size:11px}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
tr.aqui td{background:rgba(37,99,235,.18)}
ul{padding-left:18px;margin:6px 0}
li{margin:4px 0}
h2{font-size:14px;margin:16px 0 4px}
.nota{font-size:12px;color:var(--mut)}
#info{margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:13px;display:none}
</style>
</head>

<main>

  <div id="ctl"><button class="btn" id="zmas" aria-label="Acercar">+</button><button class="btn" id="zmenos" aria-label="Alejar">−</button><button class="btn" id="centro" aria-label="Centrar en mi posición">◎</button><button class="btn" id="todo" aria-label="Ver todo">⤢</button></div>
  <div id="estado"></div>
 </section>

 <section class="vista" id="vRuta"><div class="pad" style="overflow-x:auto"><table id="tabla"></table><p class="nota" id="rutaNota"></p></div></section>
 <section class="vista" id="vInfo"><div class="pad" id="infoTxt"></div></section>
</main>

  D.area.forEach(r => { cx.beginPath(); r.forEach((p, k) => { const s = aPant(p[0], p[1]); k ? cx.lineTo(s[0], s[1]) : cx.moveTo(s[0], s[1]); }); cx.stroke(); });
  cx.setLineDash([]);
  // traza: contorno blanco y color por pendiente
  cx.lineCap = "round"; cx.lineJoin = "round";
  [[7, () => "rgba(255,255,255,.9)"], [4, t => t.k == null ? "#6b7280" : COLORES[Math.min(t.k, COLORES.length - 1)]]].forEach(([ancho, col]) => {
    cx.lineWidth = ancho;
    D.tramos.forEach(t => { cx.strokeStyle = col(t); cx.beginPath(); t.c.forEach((p, k) => { const s = aPant(p[0], p[1]); k ? cx.lineTo(s[0], s[1]) : cx.moveTo(s[0], s[1]); }); cx.stroke(); });
  });
  // marcas de km
  cx.font = "600 11px system-ui"; cx.textAlign = "center"; cx.textBaseline = "middle";
  for (let km = 1; km < D.resumen.largo_km; km++) {
    const j = V.findIndex(v => v.km >= km); if (j < 1) continue; const a = V[j-1], b = V[j], f = (km - a.km) / Math.max(b.km - a.km, 1e-9);
    const s = aPant(interp(a.lon, b.lon, f), interp(a.lat, b.lat, f));
    cx.fillStyle = "rgba(15,23,42,.85)"; cx.beginPath(); cx.arc(s[0], s[1], 8, 0, 7); cx.fill(); cx.fillStyle = "#fff"; cx.fillText(km, s[0], s[1] + .5);
  }
  // puntos clave
  D.puntos.forEach(p => { const s = aPant(p.lon, p.lat); cx.fillStyle = COL_PUNTO[p.tipo] || "#111"; cx.strokeStyle = "#fff"; cx.lineWidth = 2; cx.beginPath(); cx.arc(s[0], s[1], p.tipo === "inicio" || p.tipo === "fin" ? 8 : 6, 0, 7); cx.fill(); cx.stroke(); });
  if (marcado) { const s = aPant(marcado.lon, marcado.lat); cx.strokeStyle = "#f59e0b"; cx.lineWidth = 3; cx.beginPath(); cx.arc(s[0], s[1], 13, 0, 7); cx.stroke(); }
  // mi posición
  if (gps) {
    const s = aPant(gps.lon, gps.lat), r = Math.max(8, gps.acc / (I.paso_m || 30) * esc);
    cx.fillStyle = "rgba(37,99,235,.18)"; cx.strokeStyle = "rgba(37,99,235,.6)"; cx.lineWidth = 1; cx.beginPath(); cx.arc(s[0], s[1], Math.min(r, 400), 0, 7); cx.fill(); cx.stroke();
    cx.fillStyle = "#2563eb"; cx.strokeStyle = "#fff"; cx.lineWidth = 3; cx.beginPath(); cx.arc(s[0], s[1], 8, 0, 7); cx.fill(); cx.stroke();
  }
  // escala
  const m = 1000, px = m / (I.paso_m || 30) * esc; let q = [100, 200, 500, 1000, 2000, 5000].find(v => v / (I.paso_m || 30) * esc >= 60) || 5000;
  const ancho = q / (I.paso_m || 30) * esc; cx.fillStyle = "rgba(255,255,255,.85)"; cx.fillRect(8, 8, ancho + 14, 22);
  cx.fillStyle = "#111"; cx.fillRect(15, 22, ancho, 3); cx.font = "600 11px system-ui"; cx.textAlign = "left"; cx.fillText((q >= 1000 ? q/1000 + " km" : q + " m"), 15, 15);
}
// gestos: arrastrar, pellizcar, rueda
const ptr = new Map(); let ult = null, movido = 0, d0 = 0;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); movido = 0; if (ptr.size === 2) { const [a, b] = [...ptr.values()]; d0 = Math.hypot(a[0]-b[0], a[1]-b[1]); } });
cv.addEventListener("pointermove", e => {
  if (!ptr.has(e.pointerId)) return; const p = ptr.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1]; ptr.set(e.pointerId, [e.clientX, e.clientY]); movido += Math.abs(dx) + Math.abs(dy);
  if (ptr.size === 1) { ox += dx; oy += dy; sigue = false; manual = true; dibujar(); }
  else if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]); if (d0 > 0) zoom(d / d0, (a[0]+b[0])/2 - cv.getBoundingClientRect().left, (a[1]+b[1])/2 - cv.getBoundingClientRect().top); d0 = d; sigue = false; manual = true; }
});
const fin = e => { const era1 = ptr.size === 1; if (era1 && movido < 8 && ptr.has(e.pointerId)) tocar(e.clientX - cv.getBoundingClientRect().left, e.clientY - cv.getBoundingClientRect().top); ptr.delete(e.pointerId); d0 = 0; };
cv.addEventListener("pointerup", fin); cv.addEventListener("pointercancel", e => { ptr.delete(e.pointerId); });
cv.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.2 : 1/1.2, e.offsetX, e.offsetY); sigue = false; }, {passive: false});
function zoom(f, cxp, cyp) { const n = Math.max(0.15, Math.min(14, esc * f)); f = n / esc; ox = cxp - (cxp - ox) * f; oy = cyp - (cyp - oy) * f; esc = n; dibujar(); }
$("zmas").onclick = () => { zoom(1.5, W/2, H*0.3); sigue = false; }; $("zmenos").onclick = () => { zoom(1/1.5, W/2, H*0.3); sigue = false; };
$("todo").onclick = () => { sigue = false; manual = false; ajustar(); };
$("centro").onclick = () => { if (!gps) { avisoGps(); return; } sigue = true; centrar(); };
function centrar() { if (!gps) return; const p = aPx(gps.lon, gps.lat); if (esc < 2) esc = 3; ox = W/2 - p[0]*esc; oy = H*0.3 - p[1]*esc; dibujar(); }
function tocar(x, y) {
  let mejor = null, md = 26;
  D.puntos.forEach(p => { const s = aPant(p.lon, p.lat), d = Math.hypot(s[0]-x, s[1]-y); if (d < md) { md = d; mejor = p; } });
  marcado = mejor; pintarEstado(); dibujar();
}

// ---- GPS ----
let estadoGps = {txt: "Buscando tu posición…", cls: ""};
let wid = null;
function avisoGps() { alert(estadoGps.txt); }
function iniciarGps() {
  if (!("geolocation" in navigator)) { estadoGps = {txt: "Este navegador no ofrece GPS.", cls: "bad"}; pintarEstado(); return; }
  try {
    wid = navigator.geolocation.watchPosition(pos => {
      gps = {lon: pos.coords.longitude, lat: pos.coords.latitude, acc: pos.coords.accuracy || 0, alt: pos.coords.altitude, altAcc: pos.coords.altitudeAccuracy, t: pos.timestamp, vel: pos.coords.speed, rumbo: pos.coords.heading};
      gps.p = proyectar(gps.lon, gps.lat); estadoGps = {txt: "GPS activo", cls: "ok"};
      if (sigue) centrar(); pintarEstado(); dibujar(); resaltarRuta();
    }, err => {
      const m = {1: "No diste permiso de ubicación. En el iPhone: Ajustes → Privacidad y seguridad → Localización → tu navegador → «Al usar la app». Luego recargá la página.", 2: "No se pudo obtener la posición (¿sin señal GPS, bajo techo o con el modo ahorro activado?).", 3: "El GPS tardó demasiado en responder; seguimos intentando."}[err.code] || err.message;
      estadoGps = {txt: m + (location.protocol === "file:" ? "\n\nEstás abriendo el archivo directamente del teléfono: algunos navegadores bloquean el GPS así. Probá abrirlo con Chrome o Firefox, o con la app Archivos/«Abrir en…»." : ""), cls: err.code === 3 ? "warn" : "bad"}; pintarEstado();
    }, {enableHighAccuracy: true, maximumAge: 1000, timeout: 30000});
  } catch (e) { estadoGps = {txt: "No se pudo iniciar el GPS: " + e.message, cls: "bad"}; pintarEstado(); }
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
}
function pintarEstado() {
  const el = $("estado"); let h = "";
  if (gps && gps.p) {
    const p = gps.p, kmFalta = D.resumen.largo_km - p.km, zdem = cotaEn(p.km), hF = D.tiempo.total_h - horasEn(p.km), ahora = new Date();
    const fuera = p.dist_m > 150;
    h += `<div class="fila"><span>Km <b>${fmt(p.km, 2)}</b> de ${fmt(D.resumen.largo_km, 1)}</span><span>Faltan <b>${fmt(kmFalta, 2)} km</b></span><span>↑ <b>${fmt(subeRestante(p.km))} m</b> por subir</span></div>`;
    h += `<div class="fila"><span>Altura GPS <b>${gps.alt == null ? "—" : fmt(gps.alt) + " m"}</b></span><span>Terreno en la traza (DEM) <b>${fmt(zdem)} m</b></span><span>Precisión <b>±${fmt(gps.acc)} m</b></span></div>`;
    h += `<div class="fila"><span class="${fuera ? "bad" : "ok"}">${fuera ? "⚠ Estás a <b>" + fmt(p.dist_m) + " m</b> de la traza" : "En la traza (a " + fmt(p.dist_m) + " m)"}</span><span>Con el ritmo del plan: <b>${hm(hF)}</b> → llegarías ≈ <b>${reloj(new Date(ahora.getTime() + hF*3600000))}</b></span></div>`;
    const t = tramoEn(p.km); if (t.h && D.horario) h += `<div class="fila nota"><span>Según el plan (salida ${D.horario.hora_inicio}) este tramo termina a las <b>${t.h}</b>. Si saliste a otra hora, usá «llegarías» de arriba.</span></div>`;
    h += `<div class="nota">GPS ${fmt((Date.now() - gps.t)/1000)} s atrás. La altura del GPS y la del DEM pueden diferir decenas de metros.</div>`;
  } else {
    h += `<div class="${estadoGps.cls}" style="white-space:pre-wrap">${estadoGps.txt}</div>`;
    h += `<div class="nota">Sin posición todavía: el mapa y la ruta funcionan igual. Tocá un punto de color para ver qué es.</div>`;
  }
  if (marcado) h += `<div id="info" style="display:block"><b>${ETQ_PUNTO[marcado.tipo] || marcado.tipo}</b> · km ${fmt(marcado.km, 2)}${marcado.cota_m != null ? " · " + fmt(marcado.cota_m) + " m" : ""}<br>${marcado.texto}${gps && gps.p ? "<br>A " + fmt(Math.abs(marcado.km - gps.p.km), 2) + " km de vos por la traza (" + (marcado.km >= gps.p.km ? "adelante" : "atrás") + ")" : ""}</div>`;
  el.innerHTML = h;
}

// ---- perfil ----
function pintarPerfil() {
  const c = $("perfil"), r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1; c.width = r.width * d; c.height = r.height * d;
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); const w = r.width, h = r.height, mi = 44, md = 10, ms = 12, mb = 24;
  const dark = matchMedia("(prefers-color-scheme:dark)").matches, tx = dark ? "#cbd5e1" : "#374151", rej = dark ? "#334155" : "#e5e7eb";
  g.clearRect(0, 0, w, h);
  const km = D.perfil.km, z = D.perfil.z, ok = z.filter(v => v != null), z0 = Math.floor(Math.min(...ok) / 100) * 100 - 50, z1 = Math.ceil(Math.max(...ok) / 100) * 100 + 50, L = D.resumen.largo_km;
  const X = k => mi + (w - mi - md) * k / L, Y = v => ms + (h - ms - mb) * (1 - (v - z0) / (z1 - z0));
  g.strokeStyle = rej; g.fillStyle = tx; g.font = "11px system-ui"; g.lineWidth = 1; g.textAlign = "right";
  for (let v = Math.ceil(z0 / 500) * 500; v <= z1; v += 500) { g.beginPath(); g.moveTo(mi, Y(v)); g.lineTo(w - md, Y(v)); g.stroke(); g.fillText(fmt(v), mi - 4, Y(v) + 4); }
  g.textAlign = "center"; for (let k = 0; k <= L; k += Math.max(1, Math.round(L / 8))) g.fillText(k + " km", X(k), h - 8);
  g.lineWidth = 3; g.lineCap = "round";
  for (let i = 1; i < km.length; i++) { if (z[i] == null || z[i-1] == null) continue; const t = tramoEn((km[i] + km[i-1]) / 2); g.strokeStyle = t.k == null ? "#6b7280" : COLORES[Math.min(t.k, COLORES.length - 1)]; g.beginPath(); g.moveTo(X(km[i-1]), Y(z[i-1])); g.lineTo(X(km[i]), Y(z[i])); g.stroke(); }
  if (D.isoterma_0_m != null && D.isoterma_0_m > z0 && D.isoterma_0_m < z1) { g.setLineDash([5, 4]); g.strokeStyle = "#0ea5e9"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(mi, Y(D.isoterma_0_m)); g.lineTo(w - md, Y(D.isoterma_0_m)); g.stroke(); g.setLineDash([]); g.fillStyle = "#0ea5e9"; g.textAlign = "left"; g.fillText("0 °C ≈ " + fmt(D.isoterma_0_m) + " m", mi + 4, Y(D.isoterma_0_m) - 4); }
  if (gps && gps.p) { const x = X(gps.p.km); g.strokeStyle = "#2563eb"; g.lineWidth = 2; g.beginPath(); g.moveTo(x, ms); g.lineTo(x, h - mb); g.stroke(); g.fillStyle = "#2563eb"; const zz = cotaEn(gps.p.km); if (zz != null) { g.beginPath(); g.arc(x, Y(zz), 5, 0, 7); g.fill(); } }
  $("perfilTxt").innerHTML = `<div>Salida ${fmt(D.resumen.cota_inicial_m)} m · cota máxima <b>${fmt(D.resumen.cota_max_m)} m</b> (km ${fmt(D.resumen.km_cota_max, 1)}) · llegada ${fmt(D.resumen.cota_final_m)} m</div>` +
    `<div class="nota" style="margin-top:6px">Colores por pendiente del tramo: ${D.clases.map((c, i) => `<span style="color:${COLORES[Math.min(i, COLORES.length - 1)]}">■</span> ${c}`).join(" · ")}</div>`;
}

// ---- ruta ----
function tablaRuta() {
  const t = $("tabla"), cols = ["km", "cota fin", "↑ m", "↓ m", "pend. media", "tiempo", "acum.", ...(D.hoja.some(f => f.hora_llegada) ? ["llegada"] : []), ...(D.hoja.some(f => f.t_media_est_c != null) ? ["T est."] : [])];
  t.innerHTML = "<tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr>" + D.hoja.map((f, i) => `<tr data-i="${i}"><td>${fmt(f.km_desde, f.km_desde % 1 ? 1 : 0)}–${fmt(f.km_hasta, f.km_hasta % 1 ? 1 : 0)}</td><td>${fmt(f.cota_fin_m)}</td><td>${fmt(f.ganancia_m)}</td><td>${fmt(f.perdida_m)}</td><td>${f.pendiente_media_deg == null ? "—" : fmt(f.pendiente_media_deg, 0) + "°"}</td><td>${hm(f.tiempo_min / 60)}</td><td>${hm(f.tiempo_acum_h)}</td>` +
    (D.hoja.some(x => x.hora_llegada) ? `<td class="${f.sin_luz_al_llegar ? "bad" : ""}">${f.hora_llegada || "—"}${f.sin_luz_al_llegar ? " 🌙" : ""}</td>` : "") + (D.hoja.some(x => x.t_media_est_c != null) ? `<td>${fmt(f.t_media_est_c, 0)}°</td>` : "") + "</tr>").join("");
  $("rutaNota").textContent = "Tiempo de marcha de referencia con ritmo " + fmt(D.tiempo.ritmo, 2) + " (Tobler). " + D.tiempo.nota + (D.hoja.some(f => f.t_media_est_c != null) ? " T est. = temperatura media del mes estimada por altura (modelo, no pronóstico)." : "");
}
function resaltarRuta() { if (!gps || !gps.p) return; document.querySelectorAll("#tabla tr.aqui").forEach(r => r.classList.remove("aqui")); const i = D.hoja.findIndex(f => gps.p.km <= f.km_hasta + 1e-9); const r = document.querySelector(`#tabla tr[data-i="${i < 0 ? D.hoja.length - 1 : i}"]`); if (r) r.classList.add("aqui"); }

// ---- info ----
function pintarInfo() {
  const s = D.sol, h = D.horario;
  let t = `<h2 style="margin-top:0">Resumen</h2><ul><li>Largo ${fmt(D.resumen.largo_km, 1)} km, ↑ ${fmt(D.resumen.ganancia_m)} m, ↓ ${fmt(D.resumen.perdida_m)} m; pendiente media ${fmt(D.resumen.pendiente_media_deg, 0)}°, máxima ${fmt(D.resumen.pendiente_max_deg, 0)}°.</li>` +
    `<li>Tiempo de marcha de referencia: <b>${hm(D.tiempo.total_h)}</b> (ritmo ${fmt(D.tiempo.ritmo, 2)} × Tobler).</li>`;
  if (D.isoterma_0_m != null) t += `<li>Isoterma de 0 °C del mes ≈ ${fmt(D.isoterma_0_m)} m (estimada).</li>`;
  t += "</ul>";
  if (s) t += `<h2>Sol${s.fecha ? " · " + s.fecha : ""}</h2><ul><li>Amanecer ${s.amanecer || "—"} · atardecer <b>${s.atardecer || "—"}</b> · fin del crepúsculo civil ${s.fin_crepusculo_civil || "—"}</li><li class="nota">${s.nota || ""}</li></ul>`;
  if (h) t += `<h2>Horario del plan</h2><ul><li>Salida ${h.hora_inicio}, llegada ${h.hora_fin}${h.termina_sin_luz ? ' <b class="bad">(sin luz)</b>' : ""}.</li><li class="nota">${h.nota}</li></ul>`;
  if (D.advertencias.length) t += `<h2>Advertencias</h2><ul>${D.advertencias.map(a => `<li class="warn">${a}</li>`).join("")}</ul>`;
  t += `<h2>Lo que este archivo NO sabe</h2><ul>${D.limites.map(a => `<li>${a}</li>`).join("")}<li>No reemplaza el mapa, la brújula, el pronóstico ni el criterio de quien guía: es una ayuda para ubicarte.</li></ul>`;
  t += `<h2>Datos</h2><ul><li>Relieve: DEM de ${fmt(I.res_dem_m, 0)} m, dibujado a ${fmt(I.paso_m, 0)} m por píxel; curvas de nivel cada 100 m (más marcadas cada 500 m). Fuera del polígono (línea punteada) no hay datos.</li><li>Pendientes y tiempos: ${D.tiempo.metodo}.</li><li>Generado el ${D.generado_utc} UTC · ${D.version}. Funciona sin internet: todo está dentro de este archivo.</li></ul>`;
  $("infoTxt").innerHTML = t;
}

// ---- pestañas ----
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".vista").forEach(v => v.classList.toggle("on", v.id === b.dataset.v));
  if (b.dataset.v === "vMapa") { tam(); dibujar(); } if (b.dataset.v === "vPerfil") pintarPerfil();
});
addEventListener("resize", () => { if (!manual && !(gps && sigue)) ajustar(); else { tam(); dibujar(); } if ($("vPerfil").classList.contains("on")) pintarPerfil(); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
tablaRuta(); pintarInfo(); pintarEstado(); ajustar(); iniciarGps();
setInterval(() => { if (gps) { pintarEstado(); if ($("vPerfil").classList.contains("on")) pintarPerfil(); } }, 5000);
</script>
